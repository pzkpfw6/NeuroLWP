name: Rebuild and Release Apktool Project

on:
  push:
    tags:
      - 'v*'

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Apktool
        run: |
          sudo wget https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -O /usr/local/bin/apktool
          sudo chmod +x /usr/local/bin/apktool
          sudo wget https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar -O /usr/local/bin/apktool.jar
          sudo chmod +x /usr/local/bin/apktool.jar

      - name: Compile APK
        run: apktool b . -o unsigned.apk

      - name: Sign APK (Self-Signed for Development)
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore debug.keystore -storepass android unsigned.apk androiddebugkey
          mv unsigned.apk compiled-app.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: compiled-app.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}